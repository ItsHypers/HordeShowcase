<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages has no server-side routing, so a direct hit on /admin (or a
      // refresh) 404s here. Stash the intended path and bounce to index.html,
      // which restores it via the inline script in index.html.
      sessionStorage.setItem('horde_redirect_path', location.pathname + location.search + location.hash)
      var base = location.pathname.split('/').slice(0, 2).join('/') || '/'
      location.replace(base + '/')
    </script>
  </head>
  <body>Redirecting…</body>
</html>
