<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Horde's Shiny Showcase - browse the Horde's shiny Pok&#233;mon collections." />
    <title>Horde's Shiny Showcase</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore the path preserved by public/404.html's GitHub Pages redirect trick.
      var redirectPath = sessionStorage.getItem('horde_redirect_path')
      if (redirectPath) {
        sessionStorage.removeItem('horde_redirect_path')
        if (redirectPath !== location.pathname + location.search + location.hash) {
          history.replaceState(null, '', redirectPath)
        }
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
